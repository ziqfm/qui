name: Build patched qui for Raspberry Pi 5

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag to build (empty = latest release)"
        required: false
      force:
        description: "Rebuild even if this image already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["patches/**", "tests/**", ".github/workflows/**"]

env:
  IMAGE_NAME: qui
  GOARM64_TARGET: v8.2

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read

    steps:
      # 1. Patches and tests
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: overlay

      # 2. Latest upstream release
      - name: Get latest upstream release tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          TAG="${INPUT_REF:-$(gh api repos/autobrr/qui/releases/latest --jq .tag_name)}"
          if [ -z "$TAG" ] || [ "$TAG" == "null" ]; then
            echo "Failed to fetch tag from GitHub. Exiting."
            exit 1
          fi

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/$IMAGE_NAME"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "full=$IMAGE:$TAG" >> $GITHUB_OUTPUT
          # Only a build of the latest release moves :latest
          if [ -z "$INPUT_REF" ]; then echo "latest=$IMAGE:latest" >> $GITHUB_OUTPUT; fi
          echo "Upstream release: $TAG"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Skip if this release is already built
      - name: Check if we already built this version
        id: check_build
        run: |
          FORCE="${{ inputs.force }}"
          if [ "${{ github.event_name }}" == "push" ]; then FORCE=true; fi
          if [ "$FORCE" != "true" ] && docker manifest inspect "${{ steps.get_tag.outputs.full }}" > /dev/null 2>&1; then
            echo "${{ steps.get_tag.outputs.full }} already exists. Skipping the build."
            echo "build_needed=false" >> $GITHUB_OUTPUT
          else
            echo "${{ steps.get_tag.outputs.full }} is new! Starting native build."
            echo "build_needed=true" >> $GITHUB_OUTPUT
          fi

      # 4. History without file contents
      - name: Checkout upstream qui
        if: steps.check_build.outputs.build_needed == 'true'
        run: |
          git clone --filter=blob:none --branch "${{ steps.get_tag.outputs.tag }}" https://github.com/autobrr/qui.git qui
          echo "commit=$(git -C qui rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      # 5. Patches merge three-way
      - name: Apply patches
        if: steps.check_build.outputs.build_needed == 'true'
        run: |
          for p in overlay/patches/*.patch; do
            echo "Applying $p"
            git -C qui apply --3way --verbose "../$p"
          done
          cp overlay/tests/*_test.go qui/internal/services/crossseed/

          git -C qui diff HEAD --stat

      # 6. Hot-patch the upstream Dockerfile for the Pi 5
      - name: Hot-patch the Dockerfile
        if: steps.check_build.outputs.build_needed == 'true'
        working-directory: qui
        run: |
          F=distrib/docker/Dockerfile

          # Target the Cortex-A76 (ARMv8.2-A): LSE atomics without a runtime check
          sed -i "/^RUN CGO_ENABLED=0 go build/i ENV GOARM64=${GOARM64_TARGET}" "$F"

          # Drop build paths from the binary (upstream's release builds do this too)
          sed -i 's/^RUN CGO_ENABLED=0 go build \\$/RUN CGO_ENABLED=0 go build -trimpath \\/' "$F"

          grep -q "^ENV GOARM64=${GOARM64_TARGET}$" "$F" || { echo "GOARM64 injection failed"; exit 1; }
          grep -q "go build -trimpath" "$F" || { echo "-trimpath injection failed"; exit 1; }
          echo "Dockerfile patched successfully."

      - name: Set up Go
        if: steps.check_build.outputs.build_needed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: qui/go.mod
          cache-dependency-path: qui/go.sum

      # 7. Test the patch still does what it should
      - name: Test the patched behavior
        if: steps.check_build.outputs.build_needed == 'true'
        working-directory: qui
        run: go test -count=1 ./internal/services/crossseed/ -run 'TestLocalPatch|TestBuildHardlinkDestDir'

      - name: Set up Docker Buildx
        if: steps.check_build.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v3

      # 8. Native arm64 build and push
      - name: Build and Push Docker Image
        if: steps.check_build.outputs.build_needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: qui
          file: qui/distrib/docker/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.get_tag.outputs.tag }}
            GIT_COMMIT=${{ env.commit }}
            BUILD_DATE=${{ env.build_date }}
          tags: |
            ${{ steps.get_tag.outputs.full }}
            ${{ steps.get_tag.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
